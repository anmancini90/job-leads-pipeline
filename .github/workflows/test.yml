name: Test public skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r skills/job-leads-pipeline/requirements.txt
      - name: Check manifests
        run: python -m json.tool plugin.json > /dev/null && python -m json.tool .claude-plugin/plugin.json > /dev/null && python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Check public tree for private material
        run: python scripts/audit_public_tree.py
      - name: Run offline tests
        env:
          DAILY_RESUME_PDF_TESTS: '1'
        run: python -m unittest discover -s skills/job-leads-pipeline/tests -p 'test_*.py'
      - name: Validate Claude Code package
        run: npm exec --yes --package=@anthropic-ai/claude-code -- claude plugin validate .

